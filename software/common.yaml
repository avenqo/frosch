# Frosch – gemeinsame Basis aller Sensorknoten
# Wird von den Gerätedateien per `packages:` eingebunden.
# Erwartet die Substitutions: name, friendly_name, ort

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

logger:
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

mqtt:
  broker: !secret mqtt_broker
  port: 1883
  username: !secret mqtt_user
  password: !secret mqtt_password
  topic_prefix: frosch/${ort}   # z. B. frosch/wohnzimmer/sensor/temperatur/state
  discovery: false              # kein Home Assistant

ota:
  - platform: esphome
    password: !secret ota_password

sensor:
  - platform: wifi_signal
    name: WLAN-Signal
    update_interval: 60s
